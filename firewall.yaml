apiVersion: apps/v1
kind: Deployment
metadata:
  name: cnf-firewall
  labels:
    app: cnf-firewall
    component: security
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cnf-firewall
  template:
    metadata:
      labels:
        app: cnf-firewall
    spec:
      containers:
      - name: firewall
        image: ubuntu/squid:latest
        ports:
        - containerPort: 3128
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: cnf-firewall-service
spec:
  selector:
    app: cnf-firewall
  ports:
  - protocol: TCP
    port: 3128
    targetPort: 3128
  type: ClusterIP