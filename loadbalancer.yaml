apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-lb-config
data:
  nginx.conf: |
    events {
      worker_connections 1024;
    }
    http {
      upstream backend {
        server cnf-firewall-service:3128;
      }
      server {
        listen 80;
        location / {
          proxy_pass http://backend;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          add_header X-CNF-LoadBalancer "active";
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cnf-loadbalancer
  labels:
    app: cnf-loadbalancer
    component: networking
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cnf-loadbalancer
  template:
    metadata:
      labels:
        app: cnf-loadbalancer
    spec:
      containers:
      - name: nginx-lb
        image: nginx:latest
        ports:
        - containerPort: 80
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "500m"
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-lb-config
---
apiVersion: v1
kind: Service
metadata:
  name: cnf-loadbalancer-service
spec:
  selector:
    app: cnf-loadbalancer
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  type: LoadBalancer